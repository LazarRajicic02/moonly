# Render Blueprint — Luna API + Postgres + Redis
# Dashboard: New → Blueprint → connect github.com/LazarRajicic02/moonly
# After deploy, set CORS_ORIGINS and WEB_URL to your Vercel URL.

databases:
  - name: luna-db
    plan: free
    databaseName: luna
    user: luna

services:
  - type: redis
    name: luna-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: luna-api
    runtime: docker
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: luna-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: luna-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: WEB_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      # RENDER_EXTERNAL_URL is injected automatically; optional alias:
      - key: API_URL
        fromService:
          type: web
          name: luna-api
          property: host
